
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book a Train Ticket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="ticket-page">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12">

        <section class="ticket-shell" aria-labelledby="train-title">

          <header class="ticket-header">
            <h1 id="train-title">Book a train ticket</h1>
          </header>

          <div class="ticket-body">

            <form class="ticket-form" action="task1.html" method="get">

              <!-- Journey type -->
              <fieldset class="border-0 p-0 m-0">
                <legend class="visually-hidden">Journey type</legend>

                <div class="trip-switch">
                  <input type="radio" class="btn-check"
                         id="one-way" name="journey" value="one-way">
                  <label for="one-way" class="btn">One way</label>

                  <input type="radio" class="btn-check"
                         id="round-trip" name="journey" value="round-trip">
                  <label for="round-trip" class="btn">Round trip</label>
                </div>
              </fieldset>

              <!-- From and To -->
              <div class="row g-3 mb-3">

                <div class="col-12 col-md-6">
                  <div class="city-box">
                    <label for="from-city">From *</label>
                    <input type="text"
                           id="from-city"
                           name="from"
                           class="form-control city-control"
                           placeholder="Astana"
                           required>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <div class="city-box">
                    <label for="to-city">To *</label>
                    <input type="text"
                           id="to-city"
                           name="to"
                           class="form-control city-control"
                           placeholder="Almaty"
                           required>
                  </div>
                </div>

              </div>

              <!-- Dates and passengers -->
              <div class="row g-3 mb-3">

                <div class="col-12 col-md-4">
                  <label for="departure" class="form-label">
                    Departure *
                  </label>
                  <input type="date"
                         id="departure"
                         name="departure"
                         class="form-control"
                         required>
                </div>

                <div class="col-12 col-md-4">
                  <label for="return-date" class="form-label">
                    Return
                  </label>
                  <input type="date"
                         id="return-date"
                         name="return"
                         class="form-control">
                </div>

                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">
                    Passengers
                  </label>
                  <select id="passengers"
                          name="passengers"
                          class="form-select"
                          required>
                    <option value="" selected>Choose adults</option>
                    <option value="1">1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>

              </div>

              <!-- Carriage class -->
              <fieldset class="border-0 p-0 mb-3">
                <legend class="mb-2">Carriage class *</legend>

                <div class="class-options">

                  <div class="form-check">
                    <input type="radio"
                           class="form-check-input"
                           id="seat"
                           name="carriage"
                           value="seat"
                           required>
                    <label for="seat" class="form-check-label">
                      Seat
                    </label>
                  </div>

                  <div class="form-check">
                    <input type="radio"
                           class="form-check-input"
                           id="coupe"
                           name="carriage"
                           value="coupe">
                    <label for="coupe" class="form-check-label">
                      Coupé
                    </label>
                  </div>

                  <div class="form-check">
                    <input type="radio"
                           class="form-check-input"
                           id="sleeper"
                           name="carriage"
                           value="sleeper">
                    <label for="sleeper" class="form-check-label">
                      Sleeper
                    </label>
                  </div>

                </div>
              </fieldset>

              <!-- Contact information -->
              <div class="row g-3 mb-3">

                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">
                    Phone *
                  </label>

                  <div class="input-group">
                    <span class="input-group-text phone-prefix">+7</span>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           class="form-control phone-input"
                           placeholder="701 234 56 78"
                           autocomplete="tel-national"
                           required>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">
                    Email *
                  </label>
                  <input type="email"
                         id="email"
                         name="email"
                         class="form-control"
                         placeholder="name@example.com"
                         autocomplete="email"
                         required>
                </div>

              </div>

              <!-- SMS switch -->
              <div class="form-check form-switch mb-2">
                <input type="checkbox"
                       class="form-check-input"
                       id="send-sms"
                       name="sms"
                       value="yes"
                       role="switch">
                <label for="send-sms" class="form-check-label">
                  Also send the ticket by SMS
                </label>
              </div>

              <!-- Required agreement -->
              <div class="form-check">
                <input type="checkbox"
                       class="form-check-input"
                       id="agree-rules"
                       name="agree"
                       value="yes"
                       required>
                <label for="agree-rules" class="form-check-label">
                  I agree with the carriage rules *
                </label>
              </div>

              <!-- Buttons: mobile order is reversed using Bootstrap -->
              <div class="ticket-actions d-flex flex-column-reverse
                          flex-sm-row justify-content-sm-end gap-2">

                <button type="reset" class="btn btn-outline-train">
                  Clear
                </button>

                <button type="submit" class="btn btn-find">
                  Find trains
                </button>

              </div>

            </form>

          </div>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
